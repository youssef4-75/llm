<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Chatbot</h1>
    <label for="model-select">Model</label>
    <select id="model-select">
      <option value="">Loading...</option>
    </select>
    <button type="button" id="clear-btn" title="Clear conversation">Clear</button>
  </header>

  <main id="chat-log"></main>

  <footer>
    <form id="chat-form">
      <div class="controls-row">
        <label class="temp-control" for="temperature">
          Temperature
          <input id="temperature" type="range" min="0" max="2" step="0.1" value="0.8" />
          <span id="temperature-value">0.8</span>
        </label>
        <button type="button" id="attach-btn">Attach images</button>
        <input id="image-input" type="file" accept="image/*" multiple hidden />
      </div>

      <div id="image-preview" class="image-preview" hidden></div>

      <div class="input-row">
        <input id="chat-input" type="text" placeholder="Type a message..." autocomplete="off" />
        <button type="submit" id="send-btn">Send</button>
        <button type="button" id="stop-btn" disabled>Stop</button>
      </div>
    </form>
  </footer>

  <script src="app.js"></script>
</body>
</html>
